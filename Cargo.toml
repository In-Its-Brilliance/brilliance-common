[package]
name = "common"
version = "0.1.0"
edition = "2021"

[features]
default = ["full", "wasm-plugin"]
full = [
  "tokio",
  "rusqlite",
  "flume",
  "parking_lot",
  "zip",
  "zstd",
  "bracket-lib",
  "bracket-noise",
  "bracket-random",
  "rhai",
  "spiral",
]
wasm-plugin = ["dep:brilliance-macros", "dep:extism-pdk"]

[workspace]
members = ["macros"]

[dependencies]
log = { version = "0.4.34" }
num = "0.4"
rand = "0.10.3"
regex = "1.13.1"
lazy_static = "1.5.1"
indexmap = "2.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde-inline-default = "1.0"
serde_yaml = "0.9"
strum = "0.28"
strum_macros = "0.28"
downcast-rs = "2.0.2"
typetag = "0.2.23"
ahash = "0.8.12"
postcard = { version = "1", features = ["alloc"] }
miniz_oxide = "0.9.1"
# https://github.com/bonsairobo/block-mesh-rs/blob/main/Cargo.toml
ilattice = "0.4.0"
ndshape = "0.3.0"
ndcopy = "0.3.0"
tempfile = "3"

# Optional — не нужны в wasm
tokio = { version = "1.54", features = [ "full" ], optional = true }
flume = { version = "0.12.0", optional = true }
parking_lot = { version = "0.13.0", optional = true }
# Scripts
rhai = { version = "1.27.0", features = ["internals", "serde"], optional = true }
rusqlite = { version = "0.41.0", features = ["bundled", "blob"], optional = true }
zip = { version = "9.1", optional = true }
zstd = { version = "0.14", optional = true }
# Noise world gen
bracket-lib = { version = "0.8.7", optional = true }
bracket-noise = { version = "0.8.7", optional = true }
bracket-random = { version = "0.8.7", optional = true }
# For spiral iteration
spiral = { version = "0.2", optional = true }

# Plugins
extism-pdk = { version = "1.4", optional = true }
brilliance-macros = { path = "./macros", optional = true }
redb = "4.4.0"
